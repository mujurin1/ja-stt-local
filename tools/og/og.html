<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
    overflow: hidden;
    background:
      radial-gradient(circle at 8% 110%, #dbe7ff 0 220px, transparent 221px),
      radial-gradient(circle at 104% -6%, #e3ecff 0 260px, transparent 261px),
      #f5f8ff;
    color: #0f172a;
  }
  .card {
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 44px;
  }
  .text { display: flex; flex-direction: column; gap: 20px; }
  h1 { font-size: 72px; font-weight: 900; letter-spacing: 0.01em; line-height: 1.1; }
  .sub { font-size: 32px; font-weight: 700; color: #64748b; letter-spacing: 0.04em; }

  /* アプリアイコン。ファビコンもこの要素を切り出す */
  .mic {
    flex: none;
    width: 168px; height: 168px; border-radius: 48px;
    background: #2563eb; display: grid; place-items: center;
    box-shadow: 0 12px 32px rgb(37 99 235 / 0.25);
  }
  .mic svg { width: 58%; height: 58%; }

  /* ファビコン書き出し時（make-og.ts が body に付ける） */
  body.favicon { background: transparent; }
  body.favicon .card { display: block; }
  body.favicon .text { display: none; }
  body.favicon .mic { width: 256px; height: 256px; border-radius: 72px; box-shadow: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="mic">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/>
      </svg>
    </div>
    <div class="text">
      <h1>ブラウザ音声認識アプリ</h1>
      <div class="sub">日本語・リアルタイム・完全ローカル</div>
    </div>
  </div>
</body>
</html>
