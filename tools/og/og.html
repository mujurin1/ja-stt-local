<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
    overflow: hidden;
    background:
      radial-gradient(circle at 8% 110%, #dbe7ff 0 220px, transparent 221px),
      radial-gradient(circle at 104% -6%, #e3ecff 0 260px, transparent 261px),
      #f5f8ff;
    color: #0f172a;
  }
  .card {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .lead { font-size: 72px; font-weight: 800; color: #2563eb; letter-spacing: 0.04em; }
  h1 { font-size: 136px; font-weight: 900; letter-spacing: 0.01em; }

  /* ファビコン切り出し用（OGP 画像には写らない位置に置く） */
  .mic {
    position: absolute;
    left: -400px;
    top: 0;
    width: 256px; height: 256px; border-radius: 72px;
    background: #2563eb; display: grid; place-items: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lead">ブラウザで動く</div>
    <h1>ローカル音声認識</h1>
  </div>
  <div class="mic">
    <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/>
    </svg>
  </div>
</body>
</html>
